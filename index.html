<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#072f3f" />
    <meta
      name="description"
      content="AquariumOS — a tiny operating system living beneath the surface. Glass windows float in an aquarium; fish grow as you feed them and gather at your lantern by night."
    />
    <meta property="og:title" content="AquariumOS" />
    <meta
      property="og:description"
      content="A tiny operating system living beneath the surface. Fish drift behind glass windows and peel away from the cursor."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ethaenall.github.io/aquariumos/" />
    <meta
      property="og:image"
      content="https://ethaenall.github.io/aquariumos/assets/cover.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AquariumOS" />
    <meta
      name="twitter:description"
      content="A tiny operating system living beneath the surface."
    />
    <meta
      name="twitter:image"
      content="https://ethaenall.github.io/aquariumos/assets/cover.png"
    />
    <title>AquariumOS</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,650;1,9..144,560&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="aquarium" aria-hidden="true">
      <canvas id="water" class="water"></canvas>
      <div class="water-surface"></div>
      <div class="light-rays"></div>
      <div class="caustics"></div>

      <div class="seabed">
        <svg class="rocks" viewBox="0 0 900 140" preserveAspectRatio="none">
          <path d="M0 140 C 40 120, 70 96, 120 108 C 150 70, 210 78, 240 102 C 280 64, 340 72, 380 108 C 430 80, 500 86, 540 112 C 590 70, 660 78, 710 108 C 760 86, 820 96, 900 84 L 900 140 Z" fill="#1a2c28" opacity="0.55" />
          <path d="M0 140 C 60 128, 110 112, 170 122 C 210 98, 280 104, 330 124 C 390 100, 470 108, 530 126 C 600 104, 690 110, 760 126 C 820 116, 870 122, 900 118 L 900 140 Z" fill="#243832" />
          <ellipse cx="210" cy="118" rx="46" ry="18" fill="#3a4e46" />
          <ellipse cx="430" cy="124" rx="38" ry="14" fill="#2f433c" />
          <ellipse cx="690" cy="122" rx="52" ry="16" fill="#354940" />
        </svg>
        <svg class="coral coral-left" viewBox="80 70 80 70" aria-hidden="true">
          <path d="M118 132 C 112 108, 96 96, 108 78 C 122 92, 128 108, 124 132 Z" fill="#c97b6a" />
          <path d="M132 132 C 140 110, 158 98, 148 76 C 134 90, 128 112, 132 132 Z" fill="#d48978" />
          <path d="M108 132 C 98 114, 86 104, 92 82 C 108 96, 114 116, 112 132 Z" fill="#b86b5c" />
        </svg>
        <svg class="coral coral-right" viewBox="640 70 175 70" aria-hidden="true">
          <path d="M760 134 C 748 112, 732 104, 742 80 C 760 94, 768 114, 762 134 Z" fill="#c97b6a" />
          <path d="M776 134 C 786 116, 804 102, 792 78 C 776 94, 770 116, 776 134 Z" fill="#e0a090" />
          <g transform="translate(150 -4)">
            <g class="star">
              <path d="M510 118 L516 108 L522 118 L533 120 L524 128 L526 140 L516 134 L506 140 L508 128 L499 120 Z" fill="#d9a15c" />
            </g>
          </g>
        </svg>
        <div class="sand"></div>
      </div>
      <canvas id="tank" class="tank"></canvas>
      <div class="vignette"></div>
      <div class="night-veil"></div>
    </div>

    <div class="dive-title" aria-hidden="true">
      <span class="dive-name">AquariumOS</span>
      <span class="dive-line">A tiny operating system living beneath the surface</span>
    </div>

    <header class="menubar">
      <button type="button" class="logo" aria-label="Open About AquariumOS">
        <svg class="logo-mark" viewBox="0 0 32 20" aria-hidden="true">
          <ellipse cx="18" cy="10" rx="9.5" ry="6.2" fill="url(#logoFish)" />
          <path d="M8.5 10 L1.5 4.5 V15.5 Z" fill="#7ee0d6" />
          <circle cx="22.5" cy="8.2" r="1.15" fill="#07232c" />
          <circle cx="22.85" cy="7.9" r="0.4" fill="#e8fbf7" />
          <defs>
            <linearGradient id="logoFish" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#9cf2e8" />
              <stop offset="100%" stop-color="#3aa89c" />
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-type">AquariumOS</span>
      </button>
      <div class="status-cluster">
        <button type="button" id="sonar-toggle" class="sonar-toggle" aria-label="Open Sonar search"><span class="sonar-glyph" aria-hidden="true"></span><span class="sonar-word">Sonar</span><kbd class="sonar-key">⌘K</kbd></button>
        <button type="button" id="tide-toggle" class="tide-toggle" aria-label="Cycle day, dusk, and night lighting"><span class="tide-glyph" aria-hidden="true"></span><span class="tide-label">Day</span></button>
        <span id="tank-readout" class="tank-readout" aria-label="Tank conditions">12.4 m · 24°C</span>
        <time id="clock" class="clock" datetime=""></time>
      </div>
    </header>

    <main id="desktop" class="desktop"></main>
    <div id="snap-ghost" class="snap-ghost" hidden></div>
    <canvas id="sonar-layer" class="sonar-layer" aria-hidden="true"></canvas>

    <nav class="sand-props" aria-label="Apps planted in the sand">
      <button
        type="button"
        class="sand-prop sand-prop-feed"
        data-action="feed"
        data-label="Feed"
        aria-label="Sprinkle fish food from the bowl"
        style="--i: 0; --bury: 5px; --sway: 9s; --accent: #f0b860"
      >
        <span class="sand-prop-halo" aria-hidden="true"></span>
        <span class="sand-prop-label">Feed</span>
        <span class="sand-prop-art" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <ellipse class="prop-silt" cx="32" cy="58" rx="20" ry="5" />
            <ellipse cx="32" cy="52" rx="21" ry="7.5" fill="#6d5b48" />
            <ellipse cx="32" cy="50" rx="17" ry="5.2" fill="#3c332c" />
            <ellipse cx="32" cy="49" rx="14" ry="3.6" fill="#2a241f" />
            <ellipse cx="26" cy="49.5" rx="2.4" ry="1.2" fill="#e8b05c" transform="rotate(-24 26 49.5)" />
            <ellipse cx="38" cy="50" rx="2" ry="1.1" fill="#f0c878" transform="rotate(16 38 50)" />
            <ellipse cx="32" cy="51" rx="1.7" ry="0.9" fill="#d4924a" />
            <ellipse cx="32" cy="44" rx="7.2" ry="5.6" fill="#c97b6a" />
            <g class="anemone-arms">
              <path d="M28 42 C 22 32, 24 22, 20 16" stroke="#e0a090" stroke-width="2.5" fill="none" stroke-linecap="round" />
              <path d="M32 40 C 30 28, 34 20, 31 12" stroke="#f0b8a8" stroke-width="2.7" fill="none" stroke-linecap="round" />
              <path d="M36 42 C 42 31, 40 22, 44 15" stroke="#d48978" stroke-width="2.5" fill="none" stroke-linecap="round" />
              <path d="M29 43 C 24 36, 18 34, 16 28" stroke="#c97b6a" stroke-width="2.2" fill="none" stroke-linecap="round" />
              <path d="M35 43 C 40 36, 46 34, 48 27" stroke="#e8a898" stroke-width="2.2" fill="none" stroke-linecap="round" />
            </g>
            <ellipse cx="32" cy="42" rx="4.2" ry="3.2" fill="#b86b5c" />
          </svg>
        </span>
        <span class="sand-prop-mound" aria-hidden="true"></span>
        <span class="sand-prop-pearl" aria-hidden="true"></span>
        <span class="sand-prop-sleep" aria-hidden="true"></span>
      </button>

      <button
        type="button"
        class="sand-prop sand-prop-notes"
        data-app="notes"
        data-label="Notes"
        aria-label="Open Notes"
        style="--i: 1; --bury: 3px; --sway: 8.2s; --accent: #86e3a8"
      >
        <span class="sand-prop-halo" aria-hidden="true"></span>
        <span class="sand-prop-label">Notes</span>
        <span class="sand-prop-art" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <ellipse class="prop-silt" cx="32" cy="59" rx="16" ry="4.2" />
            <path d="M31 58 C 30 42, 32 30, 30 16" stroke="#6b4428" stroke-width="5.2" fill="none" stroke-linecap="round" />
            <ellipse cx="22" cy="22" rx="10" ry="7.5" fill="#1f7050" />
            <ellipse cx="38" cy="16" rx="12" ry="9" fill="#2a9b74" />
            <ellipse cx="44" cy="24" rx="8" ry="6" fill="#176e54" />
            <ellipse cx="18" cy="28" rx="6.5" ry="5" fill="#218866" />
            <path d="M24 34 L35 24 L46 34 Z" fill="#8b5a3c" />
            <rect x="26" y="33" width="18" height="13" rx="1.6" fill="#c4a06a" />
            <rect class="cabin-window" x="32" y="36" width="6" height="5.5" rx="1" fill="#7ee0d6" />
            <path d="M36 46 V52" stroke="#7a4a28" stroke-width="1.6" />
            <path d="M36 48 L34 50 M36 50 L38 52" stroke="#9a6a40" stroke-width="1.1" />
          </svg>
        </span>
        <span class="sand-prop-mound" aria-hidden="true"></span>
        <span class="sand-prop-pearl" aria-hidden="true"></span>
        <span class="sand-prop-sleep" aria-hidden="true"></span>
      </button>

      <button
        type="button"
        class="sand-prop sand-prop-calc"
        data-app="calculator"
        data-label="Calculator"
        aria-label="Open Calculator"
        style="--i: 2; --bury: 6px; --sway: 10s; --accent: #f2cf6a"
      >
        <span class="sand-prop-halo" aria-hidden="true"></span>
        <span class="sand-prop-label">Calculator</span>
        <span class="sand-prop-art" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <ellipse class="prop-silt" cx="32" cy="58" rx="20" ry="5" />
            <rect x="11" y="32" width="42" height="22" rx="4" fill="#8a5a32" />
            <rect x="11" y="32" width="42" height="8" rx="2" fill="#6f4524" />
            <path d="M12 33 Q 32 16, 52 33 L52 36 Q 32 24, 12 36 Z" fill="#b8733a" />
            <path d="M14 34 Q 32 22, 50 34" stroke="#d4a04a" stroke-width="2.4" fill="none" />
            <rect x="11" y="36" width="42" height="3.4" fill="#c4923c" />
            <circle cx="32" cy="46" r="4.2" fill="#e8c35a" />
            <path d="M32 43.6 V48.4 M29.6 46 H34.4" stroke="#6b4018" stroke-width="1.5" stroke-linecap="round" />
            <rect x="16" y="43" width="5" height="6" rx="1" fill="#cfe7df" opacity="0.85" />
            <rect x="43" y="43" width="5" height="6" rx="1" fill="#cfe7df" opacity="0.85" />
            <path d="M18.5 44.6 V47.6 M17.2 46.1 H19.8" stroke="#3aa89c" stroke-width="1.1" stroke-linecap="round" />
            <path d="M45.5 44.6 V47.6" stroke="#3aa89c" stroke-width="1.1" stroke-linecap="round" />
            <ellipse cx="20" cy="54" rx="3.2" ry="1.6" fill="#d4a04a" opacity="0.7" />
            <ellipse cx="44" cy="54" rx="2.6" ry="1.3" fill="#e8c35a" opacity="0.7" />
          </svg>
        </span>
        <span class="sand-prop-mound" aria-hidden="true"></span>
        <span class="sand-prop-pearl" aria-hidden="true"></span>
        <span class="sand-prop-sleep" aria-hidden="true"></span>
      </button>

      <button
        type="button"
        class="sand-prop sand-prop-music"
        data-app="music"
        data-label="Music"
        aria-label="Open Music"
        style="--i: 3; --bury: 4px; --sway: 7.6s; --accent: #f4a6c8"
      >
        <span class="sand-prop-halo" aria-hidden="true"></span>
        <span class="sand-prop-label">Music</span>
        <span class="sand-prop-art" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <ellipse class="prop-silt" cx="32" cy="58" rx="15" ry="4.4" />
            <path d="M20 42 C 14 30, 22 16, 38 14 C 54 12, 56 30, 46 44 C 40 54, 24 54, 20 42 Z" fill="#e8c4b0" />
            <path d="M24 40 C 20 30, 26 20, 38 18 C 50 17, 50 32, 42 42 C 36 50, 26 48, 24 40 Z" fill="#f4ddd0" />
            <path d="M36 22 C 44 24, 46 34, 38 40 C 31 45, 27 36, 33 32" stroke="#c4897a" stroke-width="2" fill="none" stroke-linecap="round" />
            <ellipse cx="22" cy="40" rx="6.2" ry="8" fill="#9fd6e8" />
            <ellipse cx="22" cy="40" rx="3.4" ry="5" fill="#d7f3fb" opacity="0.75" />
            <path d="M40 28 C 46 26, 50 30, 48 36" stroke="#d4a090" stroke-width="1.4" fill="none" opacity="0.8" />
          </svg>
        </span>
        <span class="sand-prop-mound" aria-hidden="true"></span>
        <span class="sand-prop-pearl" aria-hidden="true"></span>
        <span class="sand-prop-sleep" aria-hidden="true"></span>
      </button>

      <button
        type="button"
        class="sand-prop sand-prop-guide"
        data-app="guide"
        data-label="Field Guide"
        aria-label="Open Field Guide"
        style="--i: 4; --bury: 6px; --sway: 9.4s; --accent: #a8c4ff"
      >
        <span class="sand-prop-halo" aria-hidden="true"></span>
        <span class="sand-prop-label">Guide</span>
        <span class="sand-prop-art" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <ellipse class="prop-silt" cx="32" cy="58" rx="20" ry="4.6" />
            <g transform="rotate(-24 32 46)">
              <rect x="11" y="37" width="32" height="17" rx="8" fill="#4f9f92" opacity="0.62" />
              <path d="M42 41 H50 V50 H42 Z" fill="#4f9f92" opacity="0.66" />
              <rect x="49.5" y="40" width="5" height="11" rx="1.6" fill="#a0744a" />
              <path d="M51 42 V49" stroke="#7a5432" stroke-width="0.9" />
              <rect class="guide-scroll" x="16" y="40.6" width="22" height="9.8" rx="4.9" fill="#efe0b8" />
              <ellipse cx="16.6" cy="45.5" rx="2" ry="4.9" fill="#d8c494" />
              <path d="M20 43.6 H33 M20 46.4 H30 M20 49 H27" stroke="#9a7c52" stroke-width="0.9" stroke-linecap="round" />
              <path d="M15 40 Q 27 36.6, 41 39.4" stroke="#e8fbf7" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round" />
              <path d="M14 50.5 Q 20 53, 30 52.6" stroke="#bff2ea" stroke-width="1" fill="none" opacity="0.4" stroke-linecap="round" />
            </g>
            <path d="M6 59 C 14 52, 22 54, 30 56 C 38 58, 48 53, 58 57 L 58 61 L 6 61 Z" fill="#7d654b" />
            <circle cx="47" cy="22" r="1.6" fill="none" stroke="#d7f3fb" stroke-width="0.8" opacity="0.6" />
            <circle cx="51" cy="15" r="1.1" fill="none" stroke="#d7f3fb" stroke-width="0.7" opacity="0.45" />
          </svg>
        </span>
        <span class="sand-prop-mound" aria-hidden="true"></span>
        <span class="sand-prop-pearl" aria-hidden="true"></span>
        <span class="sand-prop-sleep" aria-hidden="true"></span>
      </button>

      <button
        type="button"
        class="sand-prop sand-prop-about"
        data-app="about"
        data-label="About"
        aria-label="Open About AquariumOS"
        style="--i: 5; --bury: 5px; --sway: 8.8s; --accent: #7ee0d6"
      >
        <span class="sand-prop-halo" aria-hidden="true"></span>
        <span class="sand-prop-label">About</span>
        <span class="sand-prop-art" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <ellipse class="prop-silt" cx="32" cy="58" rx="18" ry="4.6" />
            <ellipse cx="32" cy="46" rx="22" ry="10" fill="#8a9690" />
            <ellipse cx="32" cy="44" rx="18" ry="7.2" fill="#c5d0cc" />
            <path class="oyster-lid" d="M12 40 Q 32 14, 52 40 Q 32 30, 12 40 Z" fill="#b7c4be" />
            <path d="M16 39 Q 32 22, 48 39" stroke="#d7e0dc" stroke-width="1.2" fill="none" opacity="0.7" />
            <circle class="oyster-pearl" cx="32" cy="38" r="5.2" fill="#e8f7f4" />
            <circle class="oyster-pearl" cx="32" cy="38" r="3.3" fill="#7ee0d6" />
            <circle cx="33.6" cy="36.4" r="1.1" fill="#ffffff" />
          </svg>
        </span>
        <span class="sand-prop-mound" aria-hidden="true"></span>
        <span class="sand-prop-pearl" aria-hidden="true"></span>
        <span class="sand-prop-sleep" aria-hidden="true"></span>
      </button>
    </nav>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
